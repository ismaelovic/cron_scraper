name: Website Monitor

on:
  schedule:
    # Runs every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows you to run it manually for testing

permissions:
  contents: write

jobs:
  check-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.14'
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync
          uv run playwright install --with-deps chromium

      - name: Check Apartment
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_APARTMENT }}
        run: uv run python monitor_apartment.py

      - name: Check Bus
        env:
          NTFY_TOPIC_BUS: ${{ secrets.NTFY_BUS }}
        run: uv run python monitor_bus.py

      - name: Save state
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add state.json
          git diff --staged --quiet || git commit -m "chore: update monitor state"
          git push